name: Build SHUFFL Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Align Expo native package versions
        run: npx expo install --fix --npm

      - name: Test mobile assessment engine
        run: npm test

      - name: Type-check mobile application
        run: npm run typecheck

      - name: Lint mobile application
        run: npm run lint

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Install Android NDK required by React Native
        working-directory: mobile/android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006"

      - name: Assemble debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy release artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/shuffl-demo-v1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shuffl-demo-v1-apk
          path: mobile/artifacts/shuffl-demo-v1.apk
          if-no-files-found: error
